name: Build Windows Electron Installer

# ═══════════════════════════════════════════════════════════════════════════
# 🎯 PURPOSE: Build Windows installer and portable exe on REAL Windows machine
# ═══════════════════════════════════════════════════════════════════════════
# This workflow builds two formats:
# 1. NSIS Installer (.exe) - Proper Windows installer with Start Menu shortcuts
# 2. Portable Executable (.exe) - No installation needed, run directly
#
# Both fix Windows 11 SmartScreen issues that ZIP format had!
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - windows-fix-clean
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test build (build full installer)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  
jobs:
  build-windows:
    name: Build Windows Installer (Electron)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ✅ Verify Node.js installation
        run: |
          node --version
          npm --version

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ✅ Verify Python installation
        run: python --version

      - name: 🔧 Setup MSBuild (Visual Studio Build Tools)
        uses: microsoft/setup-msbuild@v2

      - name: ✅ Verify MSBuild
        run: msbuild -version

      - name: 📚 Install npm dependencies
        run: npm ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: ✅ Verify critical modules
        run: |
          echo "Checking canvas module..."
          npm list canvas || echo "Canvas not found (will be built)"
          echo "Checking electron..."
          npm list electron
          echo "Checking electron-builder..."
          npm list electron-builder

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: ✅ Verify Prisma Client
        run: |
          if (Test-Path "node_modules\.prisma\client") {
            Write-Host "✅ Prisma Client generated successfully"
          } else {
            Write-Host "❌ Prisma Client generation failed"
            exit 1
          }

      - name: 🏗️ Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096

      - name: ✅ Verify Next.js build
        run: |
          if (Test-Path ".next\standalone") {
            Write-Host "✅ Next.js standalone build created"
          } else {
            Write-Host "❌ Next.js standalone build missing"
            exit 1
          }

      - name: 🎯 Build Windows Installer and Portable
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: ✅ Verify installers creation
        run: |
          Write-Host "Checking dist-electron directory..."
          if (Test-Path "dist-electron") {
            Write-Host ""
            Write-Host "═══════════════════════════════════════"
            Write-Host "📦 GENERATED FILES:"
            Write-Host "═══════════════════════════════════════"
            
            Get-ChildItem -Path "dist-electron" -Filter "*.exe" -Recurse | ForEach-Object {
              $size = [math]::Round($_.Length / 1MB, 2)
              Write-Host "✅ $($_.Name) ($size MB)"
            }
            
            $exeFiles = Get-ChildItem -Path "dist-electron" -Filter "*.exe" -Recurse
            if ($exeFiles.Count -eq 0) {
              Write-Host "❌ No installer files found!"
              Write-Host "Listing all files in dist-electron:"
              Get-ChildItem -Path "dist-electron" -Recurse
              exit 1
            }
            
            Write-Host ""
            Write-Host "Total files generated: $($exeFiles.Count)"
            Write-Host "═══════════════════════════════════════"
          } else {
            Write-Host "❌ dist-electron directory not found!"
            exit 1
          }

      - name: 📤 Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: dist-electron/*Setup*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload Portable Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: dist-electron/*Portable*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: 📋 Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            npm-debug.log*
            yarn-error.log*
            lerna-debug.log*
            .next/
            dist-electron/builder-debug.yml
            dist-electron/builder-effective-config.yaml
          if-no-files-found: warn
          retention-days: 7

      - name: 🚀 Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Windows Build #${{ github.run_number }}"
          body: |
            ## 📥 Download Windows Installer
            
            ### Two formats available:
            
            **1. NSIS Installer (Recommended)**
            - File: `RUNDA TSS Exam System Setup-0.1.0.exe`
            - Proper Windows installer with Start Menu shortcuts
            - Desktop icon included
            - Better Windows 11 SmartScreen compatibility
            
            **2. Portable Executable**
            - File: `RUNDA TSS Exam System Portable-0.1.0.exe`
            - No installation needed
            - Run directly from any folder
            - Good for USB drives or temporary use
            
            ### 📋 Installation Instructions (NSIS):
            1. Download the Setup.exe file below
            2. Run the installer
            3. Follow the installation wizard
            4. Launch from Start Menu or Desktop shortcut
            
            ### 📋 Usage Instructions (Portable):
            1. Download the Portable.exe file
            2. Place in any folder
            3. Run directly - no installation needed!
            
            ### ✅ This Build Includes:
            - All Tauri references removed (Electron-only now)
            - Fixed Windows database paths (AppData/Roaming)
            - Automatic database copy on first launch
            - All electron security modules
            - Complete login and curriculum content
            
            ### 🔧 Commit:
            ${{ github.sha }}
            
            ### 📅 Built:
            ${{ github.event.head_commit.timestamp }}
          files: dist-electron/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Build Summary
        if: success()
        run: |
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host "✅ WINDOWS BUILD SUCCESSFUL!"
          Write-Host "════════════════════════════════════════════════════════"
          Write-Host ""
          Write-Host "📦 Files created in: dist-electron/"
          Write-Host ""
          Get-ChildItem -Path "dist-electron" -Filter "*.exe" | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            Write-Host "   📁 $($_.Name)"
            Write-Host "   📊 Size: $size MB"
            Write-Host ""
          }
          Write-Host "🎯 Download from:"
          Write-Host "   https://github.com/${{ github.repository }}/releases"
          Write-Host ""
          Write-Host "════════════════════════════════════════════════════════"

  test-build:
    name: Test Build (Quick Validation)
    runs-on: windows-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma
        run: npx prisma generate

      - name: 🏗️ Test Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: ✅ Verify Build
        run: |
          if (Test-Path ".next\standalone") {
            Write-Host "✅ Build successful - ready for full installer build"
          } else {
            Write-Host "❌ Build failed"
            exit 1
          }
